<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講演リアルタイム通訳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f4; --panel:#fbfcfc; --ink:#1b2a33; --muted:#64757f; --line:#cdd8de;
  --accent:#2c5f9e; --live:#d2453d; --pending:#b8c4cb;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141c21; --panel:#1b252c; --ink:#e4ebef; --muted:#8fa0aa; --line:#2f3d46; --accent:#7fb0ea; --live:#ee7a72; --pending:#42525c; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',Meiryo,sans-serif;display:flex;flex-direction:column}
header{padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:1.05rem;margin:0;font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;min-width:7.5em}
button.primary.on{background:var(--live);border-color:var(--live)}
select,input{border:1px solid var(--line);background:var(--panel);padding:7px 10px;border-radius:6px}
input[type=password]{width:13em}
#status{padding:6px 20px;font-size:.85rem;color:var(--muted);min-height:2em}
#status.err{color:var(--live)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;padding:0 20px 20px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;display:flex;flex-direction:column}
section>h2{margin:0;padding:12px 16px;font-size:.95rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
section>h2 small{font-weight:400;color:var(--muted)}
#stream,#sumBody{overflow:auto;padding:8px 16px 16px;flex:1}
.seg{padding:12px 0 12px 14px;border-left:3px solid var(--accent);margin:10px 0}
.seg.pending{border-left-color:var(--pending)}
.seg .ja{font-size:1.45rem;line-height:1.65;font-weight:500;margin:0}
.seg.pending .ja{color:var(--muted);font-weight:400}
.seg .en{font-size:.9rem;line-height:1.6;color:var(--muted);margin:4px 0 0}
#interim{border-top:1px solid var(--line);padding:10px 16px;font-size:.9rem;color:var(--muted);min-height:3em;display:flex;gap:10px;align-items:baseline}
#interim i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--pending)}
body.rec #interim i{background:var(--live)}
.empty{color:var(--muted);line-height:1.8;padding:20px 0}
#sumBody{line-height:1.8}
#sumBody p{margin:.4em 0 .8em;font-weight:700}
#sumBody ul{margin:0;padding-left:1.2em}
#sumBody li{margin:.45em 0}
@media (max-width:820px){
  body{height:auto;display:block}
  main{grid-template-columns:1fr}
  #stream{max-height:60vh}
  .controls{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){ body.rec #interim i{animation:pulse 1.4s ease-in-out infinite} }
@keyframes pulse{50%{opacity:.3}}
</style>
</head>
<body>
<header>
  <h1>講演リアルタイム通訳</h1>
  <div class="controls">
    <select id="engine" aria-label="通訳エンジン">
      <option value="chrome">Chrome内蔵AI(無料・キー不要)</option>
      <option value="claude">Claude API(高品質・キー必要)</option>
    </select>
    <input id="apiKey" type="password" placeholder="Anthropic APIキー" autocomplete="off" hidden>
    <button id="toggle" class="primary">通訳を開始</button>
    <button id="sumNow">要約を更新</button>
    <button id="save">保存</button>
    <button id="clear">クリア</button>
  </div>
</header>
<div id="status" role="status">英語の音声をマイクで拾い、日本語訳と要約を表示します。</div>
<main>
  <section>
    <h2>日本語訳と英語原文</h2>
    <div id="stream"><p class="empty">「通訳を開始」を押してマイクを許可すると、ここに訳文が流れます。</p></div>
    <div id="interim"><i></i><span id="interimText">待機中</span></div>
  </section>
  <section>
    <h2>要約 <small id="sumInfo">未作成</small></h2>
    <div id="sumBody"><p class="empty">6文ごとに自動更新されます。停止したときも最終版を作ります。</p></div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stream = $('stream'), statusEl = $('status'), interimText = $('interimText');
  const sumBody = $('sumBody'), sumInfo = $('sumInfo');
  const engineSel = $('engine'), keyInput = $('apiKey'), toggleBtn = $('toggle');

  const TR_MODEL = 'claude-haiku-4-5';   // 速さ重視(翻訳)
  const SUM_MODEL = 'claude-sonnet-4-6'; // 品質重視(要約)
  const TR_SYSTEM = 'あなたは同時通訳者です。与えられた英語を自然な日本語に訳し、訳文だけを出力してください。説明や引用符は不要です。固有名詞は一般的な表記にしてください。';
  const SUM_SYSTEM = '英語の講演の書き起こしを日本語で要約してください。1行目に講演のテーマを1〜2文で書き、続けて要点を「- 」で始まる箇条書きで最大8点。音声認識の誤りは文脈から補ってください。';

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recog = null, running = false;
  let segs = [], queue = Promise.resolve(), translator = null, summarizer = null;
  let summarizing = false, summaryText = '';

  // ---- 設定の保存(失敗しても動くようにする) ----
  const store = {
    get(k){ try{ return localStorage.getItem(k) || ''; }catch{ return ''; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch{} }
  };
  engineSel.value = store.get('li.engine') || 'chrome';
  keyInput.value = store.get('li.key');
  const syncEngineUI = () => { keyInput.hidden = engineSel.value !== 'claude'; };
  syncEngineUI();
  engineSel.onchange = () => { store.set('li.engine', engineSel.value); syncEngineUI(); };
  keyInput.onchange = () => store.set('li.key', keyInput.value.trim());

  const setStatus = (msg, err=false) => { statusEl.textContent = msg; statusEl.className = err ? 'err' : ''; };

  // ---- 翻訳・要約エンジン ----
  async function claude(model, system, user, max){
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': keyInput.value.trim(),
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({ model, max_tokens:max, system, messages:[{role:'user', content:user}] })
    });
    if(!r.ok) throw new Error('Claude API エラー(' + r.status + ')。APIキーと利用枠を確認してください。');
    const d = await r.json();
    return d.content.map(c => c.text || '').join('').trim();
  }

  const monitor = label => m => m.addEventListener('downloadprogress', e =>
    setStatus(label + 'をダウンロード中 ' + Math.round(e.loaded*100) + '%(初回のみ)'));

  async function prepare(){
    if(engineSel.value === 'claude'){
      if(!keyInput.value.trim()) throw new Error('Anthropic APIキーを入力してください。');
      return;
    }
    if(!('Translator' in self)) throw new Error('このブラウザにはTranslator APIがありません。最新のデスクトップ版Chromeを使うか、Claude APIを選んでください。');
    translator = translator || await Translator.create({ sourceLanguage:'en', targetLanguage:'ja', monitor:monitor('翻訳モデル') });
    if('Summarizer' in self){
      try{
        summarizer = summarizer || await Summarizer.create({
          type:'key-points', format:'markdown', length:'medium', outputLanguage:'ja',
          sharedContext:'英語の講演の書き起こし', monitor:monitor('要約モデル')
        });
      }catch{ summarizer = null; }
    }
  }

  async function translate(en){
    if(engineSel.value === 'claude'){
      const prev = segs.slice(-3, -1).map(s => s.en).join(' ');
      return claude(TR_MODEL, TR_SYSTEM, (prev ? '【直前の文脈(訳さない)】' + prev + '\n【訳す文】' : '') + en, 400);
    }
    return translator.translate(en);
  }

  async function summarizeText(text){
    if(engineSel.value === 'claude') return claude(SUM_MODEL, SUM_SYSTEM, text, 1200);
    if(!summarizer) throw new Error('このブラウザにはSummarizer APIがありません。Claude APIを選ぶと要約できます。');
    return summarizer.summarize(text.slice(-12000));
  }

  // ---- 表示 ----
  function addSegment(en){
    if(!en) return;
    const seg = { en, ja:'' };
    segs.push(seg);
    const nearBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 120;
    if(segs.length === 1) stream.replaceChildren();
    const box = document.createElement('div'); box.className = 'seg pending';
    const ja = document.createElement('p'); ja.className = 'ja'; ja.textContent = '翻訳中…';
    const enEl = document.createElement('p'); enEl.className = 'en'; enEl.textContent = en;
    box.append(ja, enEl); stream.append(box);
    if(nearBottom) stream.scrollTop = stream.scrollHeight;

    queue = queue.then(async () => {
      try{
        seg.ja = await translate(en);
        ja.textContent = seg.ja; box.classList.remove('pending');
      }catch(e){
        ja.textContent = '(翻訳に失敗しました)'; setStatus(e.message, true);
      }
      if(nearBottom) stream.scrollTop = stream.scrollHeight;
    });
    if(segs.length % 6 === 0) queue.then(() => summarize());
  }

  function renderSummary(md){
    sumBody.replaceChildren();
    let ul = null;
    for(const raw of md.split('\n')){
      const line = raw.trim();
      if(!line){ ul = null; continue; }
      const clean = s => s.replace(/\*\*/g, '').replace(/^#+\s*/, '');
      const m = line.match(/^[-*•]\s+(.*)/);
      if(m){
        if(!ul){ ul = document.createElement('ul'); sumBody.append(ul); }
        const li = document.createElement('li'); li.textContent = clean(m[1]); ul.append(li);
      }else{
        ul = null;
        const p = document.createElement('p'); p.textContent = clean(line); sumBody.append(p);
      }
    }
  }

  async function summarize(){
    const text = segs.map(s => s.en).join(' ').trim();
    if(!text || summarizing) return;
    summarizing = true; sumInfo.textContent = '更新中…';
    try{
      summaryText = await summarizeText(text);
      renderSummary(summaryText);
      sumInfo.textContent = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) + ' 更新';
    }catch(e){
      sumInfo.textContent = '失敗'; setStatus(e.message, true);
    }finally{ summarizing = false; }
  }

  // ---- 音声認識 ----
  function buildRecog(){
    const r = new SR();
    r.lang = 'en-US'; r.continuous = true; r.interimResults = true;
    r.onresult = e => {
      let interim = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        const res = e.results[i];
        if(res.isFinal) addSegment(res[0].transcript.trim());
        else interim += res[0].transcript;
      }
      interimText.textContent = interim || '聞き取り中…';
    };
    r.onerror = e => {
      if(e.error === 'no-speech' || e.error === 'aborted') return;
      if(e.error === 'not-allowed'){ setStatus('マイクが許可されていません。アドレスバーの設定から許可してください。', true); stop(); return; }
      setStatus('音声認識エラー: ' + e.error, true);
    };
    r.onend = () => { if(running){ try{ r.start(); }catch{} } }; // 無音で止まっても再開
    return r;
  }

  async function start(){
    if(!SR){ setStatus('このブラウザは音声認識に対応していません。デスクトップ版のChromeかEdgeを使ってください。', true); return; }
    toggleBtn.disabled = true; setStatus('準備中…');
    try{ await prepare(); }
    catch(e){ setStatus(e.message, true); toggleBtn.disabled = false; return; }
    recog = buildRecog(); running = true;
    try{ recog.start(); }catch{}
    document.body.classList.add('rec');
    toggleBtn.textContent = '停止'; toggleBtn.classList.add('on'); toggleBtn.disabled = false;
    interimText.textContent = '聞き取り中…'; setStatus('通訳中。英語で話してください(またはスピーカーの音をマイクで拾わせます)。');
  }

  async function stop(){
    running = false;
    if(recog){ try{ recog.stop(); }catch{} }
    document.body.classList.remove('rec');
    toggleBtn.textContent = '通訳を開始'; toggleBtn.classList.remove('on');
    interimText.textContent = '待機中'; setStatus('停止しました。最終の要約を作成しています…');
    await queue; await summarize();
    if(statusEl.className !== 'err') setStatus('完了しました。「保存」でテキストに書き出せます。');
  }

  toggleBtn.onclick = () => running ? stop() : start();
  $('sumNow').onclick = async () => { await queue; summarize(); };
  $('clear').onclick = () => {
    if(segs.length && !confirm('表示中の内容をすべて消しますか?')) return;
    segs = []; summaryText = '';
    stream.innerHTML = '<p class="empty">「通訳を開始」を押してマイクを許可すると、ここに訳文が流れます。</p>';
    sumBody.innerHTML = '<p class="empty">6文ごとに自動更新されます。停止したときも最終版を作ります。</p>';
    sumInfo.textContent = '未作成';
  };
  $('save').onclick = () => {
    if(!segs.length){ setStatus('保存する内容がありません。', true); return; }
    const body = segs.map(s => s.ja + '\n' + s.en).join('\n\n');
    const text = '【要約】\n' + (summaryText || '(未作成)') + '\n\n【対訳】\n' + body + '\n';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type:'text/plain;charset=utf-8'}));
    a.download = '講演_' + new Date().toISOString().slice(0,16).replace(/[:T]/g, '-') + '.txt';
    a.click(); URL.revokeObjectURL(a.href);
  };
})();
</script>
</body>
</html>
